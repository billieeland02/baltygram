<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BaltyGram</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#05070c;
color:white;
}

/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px;
font-size:20px;
}

/* SVG ICONS */

.icon{
width:24px;
height:24px;
fill:white;
}

/* MOMENTS ROW */

.moments{
display:flex;
overflow-x:auto;
gap:12px;
padding:12px;
}

.moment{
min-width:120px;
height:160px;
border-radius:12px;
background:rgba(255,255,255,0.05);
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
}

/* FEED */

.feed{
padding:12px;
}

.post{
background:rgba(255,255,255,0.05);
border-radius:14px;
margin-bottom:20px;
padding:10px;
}

/* USER ROW */

.userrow{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.avatar{
width:36px;
height:36px;
border-radius:50%;
background:#1e293b;
background-size:cover;
background-position:center;
}

/* MEDIA */

.post img{
width:100%;
border-radius:10px;
}

/* CAPTION */

.caption{
margin-top:8px;
}

/* ACTIONS */

.actions{
display:flex;
gap:18px;
margin-top:10px;
}

.actions svg{
width:22px;
height:22px;
fill:white;
}

/* BOTTOM NAV */

.nav{
position:fixed;
bottom:0;
width:100%;
background:#0b0f1a;
display:flex;
justify-content:space-around;
padding:14px 0;
border-top:1px solid rgba(255,255,255,0.08);
}

.nav svg{
width:24px;
height:24px;
fill:white;
}

</style>

</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

<div>BaltyGram</div>

<svg class="icon" viewBox="0 0 24 24">
<path d="M21 21L15.8 15.8M10 18A8 8 0 1 1 10 2A8 8 0 0 1 10 18Z"/>
</svg>

</div>

<!-- MOMENTS -->

<div class="moments">

<div class="moment">Your Moment</div>
<div class="moment">User</div>
<div class="moment">User</div>
<div class="moment">User</div>

</div>

<!-- FEED -->

<div class="feed"></div>

<!-- BOTTOM NAV -->

<div class="nav">

<!-- HOME -->

<svg viewBox="0 0 24 24">
<path d="M3 12L12 3L21 12V21H3V12Z"/>
</svg>

<!-- VIBE -->

<svg viewBox="0 0 24 24">
<path d="M9 18V5L21 3V16"/>
<circle cx="6" cy="18" r="3"/>
<circle cx="18" cy="16" r="3"/>
</svg>

<!-- CREATE -->

<svg viewBox="0 0 24 24">
<path d="M12 5V19M5 12H19"/>
</svg>

<!-- INBOX -->

<svg viewBox="0 0 24 24">
<path d="M21 15A4 4 0 0 1 17 19H8L3 22V7A4 4 0 0 1 7 3H17A4 4 0 0 1 21 7Z"/>
</svg>

<!-- PROFILE -->

<svg viewBox="0 0 24 24">
<path d="M12 12A5 5 0 1 0 12 2A5 5 0 0 0 12 12ZM3 22A9 9 0 0 1 21 22Z"/>
</svg>

</div>

<script>

/* SUPABASE CONNECTION */

const supabaseUrl = "https://fijhdnytbqbqouyonzfq.supabase.co"

/* 🔴 PASTE YOUR ANON KEY HERE */
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpamhkbnl0YnFicW91eW9uemZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyNjU1MzIsImV4cCI6MjA4ODg0MTUzMn0.Cq5uWbhL9sq-HOo7RJPGOOpI7baY4tnzEvbehGorVaM"

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)

/* LOAD POSTS */

loadPosts()

async function loadPosts(){

const { data: posts, error } = await supabase
.from("posts")
.select(`
id,
caption,
media_urls,
created_at,
profiles (
username,
avatar_url
)
`)
.order("created_at",{ascending:false})

if(error){
console.log(error)
return
}

const feed = document.querySelector(".feed")

feed.innerHTML=""

posts.forEach(post => {

let media=""

if(post.media_urls && post.media_urls.length > 0){

media = `<img src="${post.media_urls[0]}">`

}

feed.innerHTML += `

<div class="post">

<div class="userrow">

<div class="avatar" style="background-image:url('${post.profiles.avatar_url || ""}')"></div>

<div>${post.profiles.username}</div>

</div>

${media}

<div class="caption">${post.caption || ""}</div>

</div>

`

})

}

</script>

</body>

</html>

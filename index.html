<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BaltyGram</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#05070c;
color:white;
overflow:hidden;
}

/* glow background */

.glow{
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle,#1e6bff 0%, transparent 70%);
filter:blur(140px);
animation:floatGlow 8s ease-in-out infinite;
}

@keyframes floatGlow{
0%{transform:translateY(-40px);}
50%{transform:translateY(40px);}
100%{transform:translateY(-40px);}
}

.container{
text-align:center;
padding:40px;
border-radius:20px;
backdrop-filter:blur(12px);
background:rgba(255,255,255,0.04);
box-shadow:0 0 40px rgba(0,0,0,0.4);
z-index:2;
}

.logo{
font-size:52px;
font-weight:600;
letter-spacing:1px;
background:linear-gradient(90deg,#3ea6ff,#7bbcff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tagline{
margin-top:15px;
font-size:16px;
color:#c9d3ff;
height:22px;
}

.footer{
position:absolute;
bottom:25px;
font-size:13px;
color:#8890c5;
letter-spacing:0.5px;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">
<div class="logo">BaltyGram</div>
<div class="tagline" id="typing"></div>
</div>

<div class="footer">From BaltStudios™</div>

<script>

const text="Connect. Share. Vibe.";
let i=0;

function typing(){
if(i<text.length){
document.getElementById("typing").innerHTML += text.charAt(i);
i++;
setTimeout(typing,60);
}
}

typing();

setTimeout(function(){
window.location.href="signup.html";
},4500);

</script>

</body>
</html>
